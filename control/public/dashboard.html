<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoccerTex</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23148444'/%3E%3C/svg%3E">
<style>
@font-face{font-family:'Secular One';src:url(/fonts/SecularOne-Regular.ttf);font-display:swap}
@font-face{font-family:'Roboto';font-weight:400;src:url(/fonts/Roboto-Regular.ttf);font-display:swap}
@font-face{font-family:'Roboto';font-weight:500;src:url(/fonts/Roboto-Medium.ttf);font-display:swap}
@font-face{font-family:'Roboto';font-weight:700;src:url(/fonts/Roboto-Bold.ttf);font-display:swap}
:root{
  --pitch:#148444; --amber:#A8660A; --red:#B3261E;
  --bg:#F6F8F6; --surface:#fff; --raise:#F0F5F1; --line:#DDE5DF;
  --fg:#0D1A12; --muted:#56665B;
  --display:'Secular One',Impact,sans-serif; --body:'Roboto',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --pitch:#35B86C; --amber:#E0A040; --red:#EF8178;
  --bg:#0A0F0C; --surface:#121A15; --raise:#1A251D; --line:#28352C;
  --fg:#E9F1EB; --muted:#9BAEA2; color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2{font-family:var(--display);font-weight:400;margin:0}
a{color:var(--pitch)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* top bar + page links */
header{background:#148444;color:#fff}
.hd{display:flex;align-items:center;gap:12px;padding-block:14px}
.hd h1{font-size:20px}
.hd h1 a{color:inherit;text-decoration:none}
.live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:#B6F2CE}
.dot.bad{background:#FFB4AB}
nav{background:var(--surface);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:2px;overflow-x:auto;padding-inline:6px}
nav a{padding:12px 10px 9px;font-size:15px;color:var(--muted);text-decoration:none;white-space:nowrap;
      border-bottom:3px solid transparent}
nav a:hover{color:var(--fg)}
nav a[aria-current=page]{color:var(--fg);font-weight:500;border-bottom-color:var(--pitch)}
nav a i{font-style:normal;font-size:12px;font-weight:500;background:var(--raise);border-radius:10px;
        padding:1px 7px;margin-left:3px}
nav a:focus-visible{outline:2px solid var(--pitch);outline-offset:-2px}
nav a i:empty{display:none}
@media(max-width:560px){
  nav a{font-size:14.5px;padding-inline:8px}
  nav a i{display:none}            /* the counts go, so all five links fit */
}

.headline{font-family:var(--display);font-size:26px;line-height:1.25;margin:26px 0 4px;text-wrap:balance}
.subline{color:var(--muted);margin:0 0 22px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.card h2{font-size:17px;margin-bottom:12px}
.seeall{display:inline-block;margin-top:12px;font-size:14.5px}

button{font:inherit;font-weight:500;font-size:14.5px;cursor:pointer;border-radius:9px;padding:9px 16px;
       border:1px solid var(--line);background:var(--surface);color:var(--fg);white-space:nowrap}
button:hover{border-color:var(--pitch)}
button.primary{background:#148444;border-color:#148444;color:#fff}
button.primary:hover{background:#0f6b36}
button.stop{color:var(--red)}
button.stop:hover{border-color:var(--red)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}

/* a row with a title, a sentence, and maybe a button — setup steps and tools */
.step{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0;padding-top:0}
.step:last-child{padding-bottom:0}
.mark{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
      font-size:14px;font-weight:700;background:var(--raise);color:var(--muted)}
.mark.done{background:#148444;color:#fff}
.step .txt{flex:1;min-width:0}
.step .txt b{display:block;font-weight:500}
.step .txt span{font-size:13.5px;color:var(--muted)}
.step .txt em{font-style:normal;font-weight:500;color:var(--fg)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:var(--raise);
     padding:1px 6px;border-radius:5px;overflow-wrap:anywhere}
.bar{height:6px;border-radius:3px;background:var(--raise);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pitch);transition:width .4s}

/* posts */
.post{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--line)}
.post:first-child{border-top:0;padding-top:0}
.thumb{flex:none;width:46px;height:82px;border-radius:7px;background:var(--raise) center/cover;padding:0;border:0;
       display:grid;place-items:center;font-size:10.5px;font-weight:400;color:var(--muted);text-align:center;
       line-height:1.2;white-space:normal}
.thumb.play{font-size:18px;color:var(--pitch)}
.post .info{flex:1;min-width:0}
.post .title{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.post .meta{font-size:13.5px;color:var(--muted);margin-top:2px}
.post .state{font-size:13px;margin-top:3px}
.state.ready{color:var(--pitch)} .state.wait{color:var(--amber)} .state.bad{color:var(--red)}
.post .acts{display:flex;gap:7px;flex:none}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;color:#fff;vertical-align:1px}
.chip.instagram{background:#C13584} .chip.linkedin{background:#0A66C2}
.empty{color:var(--muted);padding:14px 0;text-align:center}
.more{display:block;margin:12px auto 0}
@media(max-width:560px){
  .post,.step{flex-wrap:wrap}
  .post .acts{width:100%;padding-left:59px}
  .step button{margin-left:38px}
  .tool button{margin-left:0}
}

pre{background:#0B1410;color:#CFE3D6;border-radius:9px;padding:12px;font-size:12.5px;max-height:320px;
    overflow:auto;white-space:pre-wrap;margin:8px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.label{font-size:13px;color:var(--muted);margin-top:16px}

/* watch window */
#watch{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;display:flex;
       align-items:center;justify-content:center;padding:16px}
#watch .box{background:var(--surface);border-radius:14px;padding:16px;width:100%;max-width:400px;
            max-height:100%;overflow:auto}
#watch video{display:block;width:100%;max-height:62vh;border-radius:9px;background:#000}
#watch h2{font-size:16px;margin:12px 0 4px}
#watch p{font-size:13.5px;color:var(--muted);margin:0 0 12px;white-space:pre-wrap;max-height:120px;overflow:auto}
#watch .row{display:flex;gap:9px;flex-wrap:wrap}
#watch .nope{background:var(--raise);border-radius:9px;padding:26px 18px;text-align:center}
#watch .nope b{display:block;margin-bottom:6px}
#watch .nope span{font-size:14px;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);
       padding:11px 18px;border-radius:10px;font-size:14.5px;z-index:60;max-width:calc(100% - 32px);
       box-shadow:0 6px 24px rgba(0,0,0,.25);pointer-events:none}   /* never blocks a button under it */
#toast.bad{background:#B3261E;color:#fff}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap hd">
  <h1><a href="/">SoccerTex</a></h1>
  <span class="live"><span class="dot" id="dot"></span><span id="live">connecting…</span></span>
</div></header>

<nav aria-label="Pages"><div class="wrap">
  <a href="/" data-page="home">Home</a>
  <a href="/schedule" data-page="schedule">Schedule <i id="n-upcoming"></i></a>
  <a href="/stopped" data-page="stopped">Stopped <i id="n-stopped"></i></a>
  <a href="/published" data-page="published">Published <i id="n-published"></i></a>
  <a href="/tools" data-page="tools">Tools</a>
</div></nav>

<main class="wrap" id="page"></main>

<div id="watch" hidden></div>
<div id="toast" role="status" hidden></div>
<script src="/dashboard.js"></script>
</body>
</html>
