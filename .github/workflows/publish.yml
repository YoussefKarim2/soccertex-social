name: Publish due posts
on:
  schedule:
    # ASKING FOR FEWER RUNS, NOT MORE.
    #
    # Measured over seven days, GitHub delivered this workflow 1, 2, 4, 4, 4
    # and 3 scheduled runs a day — against a cron offering 144. That is not
    # jitter around a schedule, it is a per-workflow quota of roughly four
    # runs a day that GitHub hands out whenever it feels like it. Going from
    # hourly to every ten minutes changed nothing, because frequency is not
    # what is being honoured.
    #
    # So stop asking for 144. These nine are the four publish slots at :32,
    # each slot's one-hour catch-up, and two overnight sweeps. If GitHub is
    # going to deliver about four of what we ask for, far better that they are
    # drawn from nine requests clustered on the slots than from 144 scattered
    # across the day — the delivered runs then land near a slot instead of at
    # 03:48.
    #
    # Every published item records late_minutes and preflight reports the
    # median and worst, so this is a measurement, not a hope. If the next few
    # days do not improve on a 273-minute median, the cron is not the lever
    # and the trigger has to come from outside GitHub entirely.
    - cron: "32 3,11,12,13,15,16,17,18,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run: { description: "Resolve only, publish nothing", type: boolean, default: true }
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Publish
        env:
          IG_USER_ID:      ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
          # The Company Page id. With this set the publisher posts as
          # urn:li:organization:<id>; without it it would quietly fall back to
          # whichever member the token belongs to — the company's content on
          # someone's personal timeline, which nobody would notice until it
          # was there.
          LI_ORGANIZATION_ID: ${{ vars.LI_ORGANIZATION_ID }}
          LI_AUTHOR_URN:   ${{ secrets.LI_AUTHOR_URN }}
          MEDIA_BASE_URL:  ${{ vars.MEDIA_BASE_URL }}
        run: |
          FLAG="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          # Run both whatever happens to either. Chaining them meant a
          # LinkedIn problem could stop Instagram from being attempted at
          # all, and one platform's trouble is not a reason to hold the
          # other's post.
          set +e
          python3 publish/instagram.py --queue queue.json $FLAG; IG=$?
          python3 publish/linkedin.py  --queue queue.json $FLAG; LI=$?
          echo "instagram exit $IG, linkedin exit $LI"
          # Exit 1 means a post genuinely failed; 2 means misconfigured.
          # Either is worth a red run. A clean skip now returns 0.
          [ $IG -eq 0 ] && [ $LI -eq 0 ]
      - name: Record results
        if: always()
        run: |
          git config user.name  "soccertex-bot"
          git config user.email "bot@users.noreply.github.com"
          git add queue.json
          git diff --staged --quiet || {
            git commit -m "publish: $(date -u +%Y-%m-%dT%H:%MZ)"
            # Two workflows and the review desk all commit to main now, so a
            # plain push can lose a race and be rejected non-fast-forward —
            # which would mean a post that went out was recorded nowhere and
            # would be attempted again on the next run. Rebase and retry.
            for i in 1 2 3; do
              git push && exit 0
              git pull --rebase --autostash -q origin main || true
            done
            echo "could not record the result after 3 tries" >&2
            exit 1
          }
