name: Publish due posts
on:
  schedule:
    # Every 10 minutes, on minutes nobody else picks.
    #
    # GitHub's scheduler is best-effort and drops runs. Measured on this repo:
    # an hourly cron produced 3 runs in 28 hours, roughly one every 8 hours,
    # which is why the 16:00 post on 10 Nov never had a run to go out in. The
    # publisher already picks up anything overdue, so the fix is more chances
    # — and chances at times the scheduler is not busiest. :00, :15, :30 and
    # :45 are where almost every cron in the world lands, so these are offset
    # by 4 minutes. Each run is a few seconds and Actions minutes are free on
    # a public repository.
    #
    # This reduces lateness; it cannot eliminate it. Each published item now
    # records late_minutes, and preflight reports the median and the worst, so
    # whether this is good enough is a measurement rather than a hope.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
    inputs:
      dry_run: { description: "Resolve only, publish nothing", type: boolean, default: true }
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Publish
        env:
          IG_USER_ID:      ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
          LI_AUTHOR_URN:   ${{ secrets.LI_AUTHOR_URN }}
          MEDIA_BASE_URL:  ${{ vars.MEDIA_BASE_URL }}
        run: |
          FLAG="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          # Run both whatever happens to either. Chaining them meant a
          # LinkedIn problem could stop Instagram from being attempted at
          # all, and one platform's trouble is not a reason to hold the
          # other's post.
          set +e
          python3 publish/instagram.py --queue queue.json $FLAG; IG=$?
          python3 publish/linkedin.py  --queue queue.json $FLAG; LI=$?
          echo "instagram exit $IG, linkedin exit $LI"
          # Exit 1 means a post genuinely failed; 2 means misconfigured.
          # Either is worth a red run. A clean skip now returns 0.
          [ $IG -eq 0 ] && [ $LI -eq 0 ]
      - name: Record results
        if: always()
        run: |
          git config user.name  "soccertex-bot"
          git config user.email "bot@users.noreply.github.com"
          git add queue.json
          git diff --staged --quiet || { git commit -m "publish: $(date -u +%Y-%m-%dT%H:%MZ)"; git push; }
