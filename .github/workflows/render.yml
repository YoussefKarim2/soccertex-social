name: Render content
on:
  schedule:
    - cron: "0 3 * * 0"          # Sundays 03:00 UTC
  workflow_dispatch:
    inputs:
      force: { description: "Re-render everything", type: boolean, default: false }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install pillow numpy
      - name: Rebuild footage proxies
        run: ./make_proxies.sh
      - name: Render the library
        run: python3 build_all.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: Roll the schedule forward
        run: python3 -m engine.queue_build
      - name: Commit
        run: |
          git config user.name  "soccertex-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A out queue.json assets/footage/proxy
          git diff --staged --quiet || git commit -m "render: $(date -u +%Y-%m-%d)"
          git push
