<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SoccerTex Review Desk</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Source+Sans+3:wght@400;600&family=Roboto+Condensed:wght@400;700&display=swap">
<style>
:root{
  --pitch:#0E7A3C;--bone:#FAF8F3;--surface:#fff;--raise:#F1F4EF;--line:#DFE4DB;
  --ink:#131A14;--muted:#5C6A5E;--faint:#8A968C;--amber:#B4740E;--red:#A8281F;
  --display:'Secular One',Impact,sans-serif;--body:'Source Sans 3',system-ui,sans-serif;
  --data:'Roboto Condensed','Arial Narrow',sans-serif;
  --shadow:0 1px 2px rgba(19,26,20,.05),0 6px 18px rgba(19,26,20,.05);
}
@media (prefers-color-scheme:dark){:root{
  --pitch:#3FBE74;--bone:#0C110D;--surface:#141B15;--raise:#1B241C;--line:#2A352B;
  --ink:#E8EFE9;--muted:#9BAA9E;--faint:#6E7D71;--amber:#E0A542;--red:#F08B82;
  color-scheme:dark;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bone);color:var(--ink);font-family:var(--body);font-size:16px;
  line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
.num{font-family:var(--data);font-variant-numeric:tabular-nums}

header{background:var(--pitch);color:#fff}
.hd{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 18px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hd h1{font-size:clamp(20px,4.6vw,26px);line-height:1.1}
.hd .right{margin-left:auto;font-size:12.5px;opacity:.9;display:flex;align-items:center;gap:12px}
.hd button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;
  font-size:12.5px;padding:4px 10px;border-radius:7px;cursor:pointer}
.hd button:hover{background:rgba(255,255,255,.24)}

/* the one fact that matters, before anything else */
.next{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pitch);
  border-radius:11px;padding:14px 16px;margin:18px 0 12px;box-shadow:var(--shadow)}
.next .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.next .h{font-size:17px;line-height:1.3;margin-top:3px;text-wrap:balance}
.next .w{font-size:13.5px;color:var(--muted);margin-top:4px}
.next.none{border-left-color:var(--faint)}

.health{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
@media (max-width:560px){.health{grid-template-columns:1fr}}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;display:flex;gap:10px;align-items:flex-start}
.hcard .bulb{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--pitch)}
.hcard.warn .bulb{background:var(--amber)} .hcard.bad .bulb{background:var(--red)}
.hcard .t{font-size:14px;font-weight:600}
.hcard .s{font-size:13px;color:var(--muted)}
.hcard.warn .s{color:var(--amber)} .hcard.bad .s{color:var(--red)}

.runline{font-size:13px;color:var(--faint);margin:10px 0 20px}
.runline a{color:var(--faint);text-decoration:underline}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;
  overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font:inherit;font-size:14px;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--muted);padding:9px 11px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pitch);font-weight:600}
.tab .b{font-family:var(--data);font-size:12px;background:var(--raise);color:var(--muted);
  border-radius:999px;padding:1px 7px;margin-left:5px}
.tab[aria-selected="true"] .b{background:var(--pitch);color:#fff}
.tab .b.alert{background:var(--amber);color:#fff}

.dayhead{font-family:var(--data);font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.dayhead::after{content:"";flex:1;height:1px;background:var(--line)}
.dayhead:first-child{margin-top:4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;display:grid;
  grid-template-columns:160px 1fr}
@media (max-width:620px){.card{grid-template-columns:1fr}}
.media{background:#0A0F0B;min-width:0;position:relative}
video{width:100%;display:block;aspect-ratio:9/16;object-fit:cover;background:#0A0F0B}
@media (max-width:620px){video{aspect-ratio:16/10}}
.bd{padding:13px 15px 14px;min-width:0;display:flex;flex-direction:column;gap:8px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.chip{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;color:#fff;white-space:nowrap}
.chip-instagram{background:#B5317E}.chip-linkedin{background:#0A66C2}
.when{color:var(--muted)}.when b{color:var(--ink);font-weight:600}
.pillar{color:var(--faint)}
.hook{font-size:16.5px;line-height:1.25;text-wrap:balance}
details summary{font-size:13px;color:var(--pitch);cursor:pointer;width:fit-content}
details p{font-size:14px;color:var(--muted);white-space:pre-wrap;margin:7px 0 0}
.state{font-size:13px;padding:7px 10px;border-radius:7px;background:var(--raise);
  border-left:3px solid var(--faint);color:var(--muted)}
.state.manual{border-left-color:var(--amber);color:var(--amber)}
.state.veto{border-left-color:var(--red);color:var(--red)}
.state.done{border-left-color:var(--pitch);color:var(--pitch)}
label.nl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
textarea,input{width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:var(--raise);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{resize:vertical}
textarea:focus-visible,input:focus-visible{outline:2px solid var(--pitch);outline-offset:1px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.act{font:inherit;font-size:13px;cursor:pointer;border-radius:8px;padding:7px 12px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.act:hover{border-color:var(--pitch)}
button.act:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
button.act[aria-pressed="true"]{background:var(--pitch);border-color:var(--pitch);color:#fff}
button.act.veto[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
button.act:disabled{opacity:.5;cursor:not-allowed}
.saved{font-size:12px;color:var(--pitch);opacity:0;transition:opacity .2s}
.saved.on{opacity:1}.saved.bad{color:var(--red)}
.card.off{opacity:.55}

.gate{max-width:440px;margin:8vh auto;display:flex;flex-direction:column;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate h1{font-size:26px}
.gate p{margin:0;font-size:14.5px;color:var(--muted)}
.gate ol{margin:0;padding-left:20px;font-size:14.5px;color:var(--muted)}
.gate li{margin-bottom:5px}
.gate code{background:var(--raise);padding:1px 5px;border-radius:4px;font-size:13px}
.gate button{font:inherit;font-size:14px;cursor:pointer;border-radius:8px;padding:9px 14px;
  border:1px solid var(--pitch);background:var(--pitch);color:#fff}
.err{color:var(--red);font-size:13.5px;min-height:20px}
.empty{color:var(--faint);padding:34px 0;text-align:center;font-size:14.5px}
footer{margin-top:30px;padding-top:15px;border-top:1px solid var(--line);
  font-size:13px;color:var(--faint)}
a{color:var(--pitch)}
.lnk{background:none;border:none;color:var(--faint);padding:0;font-size:13px;
  text-decoration:underline;cursor:pointer;font-family:inherit}
</style></head><body>
<div id="root"></div>
<script>
/* SoccerTex Review Desk — static page, no server.
 *
 * Reads queue.json and the Actions runs straight from the GitHub REST API
 * (it sends CORS headers, so a browser may call it) and writes decisions back
 * as commits. The only credential is the viewer's own fine-grained token,
 * kept in this browser and scoped to one repository. */

const REPO = "YoussefKarim2/soccertex-social";
const BRANCH = "main";
const API = "https://api.github.com";
const KEY = "soccertex.desk.token";

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let token = null;
try { token = localStorage.getItem(KEY); } catch (e) {}

const gh = (path, init = {}) => fetch(API + path, {
  ...init,
  headers: {
    Authorization: "Bearer " + token,
    Accept: "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28",
    ...(init.headers || {}),
  },
});

const fromB64 = s => new TextDecoder().decode(
  Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));
const toB64 = s => {
  const b = new TextEncoder().encode(s);
  let bin = ""; b.forEach(x => { bin += String.fromCharCode(x); });
  return btoa(bin);
};

let SHA = null, QUEUE = null, RUNS = [], TAB = "next";

async function readQueue() {
  const r = await gh(`/repos/${REPO}/contents/queue.json?ref=${BRANCH}&t=${Date.now()}`);
  if (r.status === 401 || r.status === 403) throw new Error("token-bad");
  if (!r.ok) throw new Error("Could not read the queue (" + r.status + ")");
  const j = await r.json();
  SHA = j.sha;
  QUEUE = JSON.parse(fromB64(j.content));
}

async function writeQueue(message) {
  const r = await gh(`/repos/${REPO}/contents/queue.json`, {
    method: "PUT",
    body: JSON.stringify({ message, branch: BRANCH, sha: SHA,
      content: toB64(JSON.stringify(QUEUE, null, 2) + "\n") }),
  });
  if (r.status === 409) { await readQueue(); throw new Error("Queue changed — reloaded, try again"); }
  if (!r.ok) throw new Error("Write refused (" + r.status + ")");
  SHA = (await r.json()).content.sha;
}

async function readRuns() {
  try {
    const r = await gh(`/repos/${REPO}/actions/runs?per_page=10`);
    return r.ok ? ((await r.json()).workflow_runs || []) : [];
  } catch (e) { return []; }
}

/* ---------- sign in ---------- */

function gate(msg = "") {
  document.body.innerHTML = '<div id="root"></div>';
  $("#root").innerHTML = `<div class="gate">
    <h1>SoccerTex Review Desk</h1>
    <p>This page talks to your repository directly. It needs a token that can edit
       <code>${esc(REPO)}</code> and nothing else.</p>
    <ol>
      <li>GitHub → Settings → Developer settings → <b>Fine-grained tokens</b></li>
      <li>Repository access: <b>Only select repositories</b> → <code>soccertex-social</code></li>
      <li>Permissions: <b>Contents: Read and write</b>, <b>Actions: Read-only</b></li>
    </ol>
    <input id="tok" type="text" placeholder="github_pat_..." autocomplete="off"
      autocapitalize="off" autocorrect="off" spellcheck="false" data-1p-ignore data-lpignore="true">
    <div id="cnt" style="font-size:12.5px;color:var(--faint)">Nothing pasted yet. A fine-grained
      token is about 93 characters and starts <code>github_pat_</code>.</div>
    <button id="go">Open the desk</button>
    <div class="err">${esc(msg)}</div>
    <p style="font-size:13px">Stored in this browser only. Revoke it from the same GitHub
       page and this stops working immediately.</p></div>`;
  const inp = $("#tok"), cnt = $("#cnt");
  inp.oninput = () => {
    const v = inp.value.trim();
    if (!v) { cnt.textContent = "Nothing pasted yet."; cnt.style.color = "var(--faint)"; return; }
    const ok = v.startsWith("github_pat_");
    cnt.textContent = v.length + " characters" + (ok ? " — looks like a fine-grained token."
      : " — this does not start with github_pat_, so it is probably not the token.");
    cnt.style.color = ok ? "var(--pitch)" : "var(--red)";
  };
  const go = async () => {
    const v = inp.value.trim();
    if (!v) return;
    token = v;
    try {
      await readQueue();
      try { localStorage.setItem(KEY, v); } catch (e) {}
      load();
    } catch (e) {
      token = null;
      gate(e.message === "token-bad"
        ? "That token cannot read the repository. Check the repo and the Contents permission."
        : e.message);
    }
  };
  $("#go").onclick = go;
  inp.onkeydown = e => { if (e.key === "Enter") go(); };
  inp.focus();
}

/* ---------- helpers ---------- */

const PLAT = { instagram: "Instagram", linkedin: "LinkedIn" };

const dayLabel = d => {
  const t = new Date(); t.setUTCHours(0, 0, 0, 0);
  const x = new Date(d); x.setUTCHours(0, 0, 0, 0);
  const diff = Math.round((x - t) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Tomorrow";
  return x.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
};

function away(iso) {
  const ms = new Date(iso) - Date.now();
  if (ms < 0) return "overdue";
  const h = Math.floor(ms / 3600000), m = Math.round((ms % 3600000) / 60000);
  if (h >= 24) return `in ${Math.round(h / 24)} days`;
  if (h >= 1) return `in ${h}h ${m}m`;
  return `in ${m} minutes`;
}

const hookOf = it => (it.caption || "").trim().split("\n")[0];
const isPending = it => it.status === "queued" && !it.manual;
const isOverdue = it => isPending(it) && new Date(it.publish_at) < Date.now();

function stateOf(it) {
  if (it.status === "published") {
    const p = it.result && it.result.permalink;
    return ["done", p ? `Published — <a href="${esc(p)}" target="_blank" rel="noopener">see the post</a>`
                      : "Published."];
  }
  if (it.status === "failed") return ["veto", "Failed: " + esc(it.last_error || "no detail")];
  if (it.status === "vetoed") return ["veto", "Stopped. This will not publish."];
  if (it.status === "blocked") return ["veto", "No video rendered for this one yet."];
  if (it.manual) return ["manual", "Held back for you to post in the app with a trending sound."];
  if (it.review_note) return ["", "Change requested. Still scheduled until it is reworked."];
  return ["", ""];
}

/* ---------- card ---------- */

function card(it) {
  const d = new Date(it.publish_at);
  const [cls, text] = stateOf(it);
  const done = it.status === "published";
  return `<article class="card ${it.status === "vetoed" ? "off" : ""}" data-id="${esc(it.id)}">
    <div class="media"><video src="../${esc(it.video)}" preload="metadata" controls playsinline muted></video></div>
    <div class="bd">
      <div class="meta">
        <span class="chip chip-${esc(it.platform)}">${PLAT[it.platform] || it.platform}</span>
        <span class="when"><b class="num">${d.toISOString().slice(11, 16)}</b> UTC</span>
        <span class="pillar">${esc((it.pillar || "").replace(/^\d\s/, ""))}</span>
      </div>
      <h3 class="hook">${esc(hookOf(it))}</h3>
      <details><summary>Full caption</summary><p>${esc(it.caption)}</p></details>
      ${text ? `<div class="state ${cls}">${text}</div>` : ""}
      ${done ? "" : `
      <label class="nl" for="n-${esc(it.id)}">Changes you want</label>
      <textarea id="n-${esc(it.id)}" rows="2"
        placeholder="e.g. cut the intro, lead with the 150 GSM number">${esc(it.review_note || "")}</textarea>
      <div class="acts">
        <button class="act" data-k="manual" aria-pressed="${!!it.manual}">Trending sound — I'll post this one</button>
        <button class="act veto" data-k="veto" aria-pressed="${it.status === "vetoed"}">Don't post this</button>
        <span class="saved"></span>
      </div>`}
    </div></article>`;
}

function groupByDay(items) {
  if (!items.length) return "";
  let out = "", last = "";
  for (const it of items) {
    const lab = dayLabel(it.publish_at);
    if (lab !== last) { out += `<div class="dayhead">${esc(lab)}</div>`; last = lab; }
    out += card(it);
  }
  return out;
}

/* ---------- writes ---------- */

let busy = false;

async function commit(id, patch, el) {
  const saved = $(".saved", el);
  if (busy) { saved.className = "saved on"; saved.textContent = "One moment"; return; }
  busy = true;
  saved.className = "saved on"; saved.textContent = "Saving";
  try {
    const it = QUEUE.items.find(i => i.id === id);
    if (!it) throw new Error("gone from the queue");
    if (it.status === "published") throw new Error("already published");
    const what = [];
    if ("veto" in patch) { it.status = patch.veto ? "vetoed" : "queued";
      what.push(patch.veto ? "vetoed" : "un-vetoed"); }
    if ("manual" in patch) { if (patch.manual) it.manual = true; else delete it.manual;
      what.push(patch.manual ? "held for manual posting" : "back to auto"); }
    if ("note" in patch) { const n = patch.note.trim();
      if (n) it.review_note = n; else delete it.review_note;
      what.push(n ? "note added" : "note cleared"); }
    await writeQueue(`Review desk: ${id} — ${what.join(", ")}`);
    saved.textContent = "Saved";
    setTimeout(() => saved.classList.remove("on"), 1500);
    paintCounts();
  } catch (e) {
    saved.classList.add("bad");
    saved.textContent = e.message === "token-bad" ? "Token rejected" : e.message;
  } finally { busy = false; }
}

function wire() {
  document.querySelectorAll(".card").forEach(el => {
    const id = el.dataset.id;
    el.querySelectorAll("button[data-k]").forEach(b => b.onclick = () => {
      const on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", String(on));
      if (b.dataset.k === "veto") el.classList.toggle("off", on);
      commit(id, { [b.dataset.k]: on }, el);
    });
    const ta = $("textarea", el);
    let t;
    if (ta) ta.oninput = () => { clearTimeout(t); t = setTimeout(() => commit(id, { note: ta.value }, el), 900); };
  });
}

/* ---------- view ---------- */

function buckets() {
  const items = (QUEUE.items || []).slice()
    .sort((a, b) => a.publish_at.localeCompare(b.publish_at));
  return {
    all: items,
    next: items.filter(i => isPending(i) && !isOverdue(i)),
    attention: items.filter(i => i.manual || i.status === "failed" ||
                                 i.status === "vetoed" || i.status === "blocked" ||
                                 i.review_note || isOverdue(i)),
    published: items.filter(i => i.status === "published").reverse(),
  };
}

function paintCounts() {
  const b = buckets();
  const set = (k, n, alert) => {
    const el = document.querySelector(`.tab[data-t="${k}"] .b`);
    if (el) { el.textContent = n; el.classList.toggle("alert", !!alert); }
  };
  set("next", b.next.length);
  set("attention", b.attention.length, b.attention.some(i => i.status === "failed" || isOverdue(i)));
  set("published", b.published.length);
}

function platformHealth(items, plat) {
  const mine = items.filter(i => i.platform === plat);
  const pub = mine.filter(i => i.status === "published");
  const over = mine.filter(isOverdue);
  const fail = mine.filter(i => i.status === "failed");
  const next = mine.find(i => isPending(i) && !isOverdue(i));
  if (fail.length) return ["bad", `${fail.length} failed. Open the run below for the reason.`];
  if (over.length) return ["bad",
    `${over.length} past due and still unpublished — ${PLAT[plat]} is not connected.`];
  if (pub.length) return ["", `${pub.length} published. Next ${next ? away(next.publish_at) : "— none left"}.`];
  return ["warn", next ? `Nothing published yet. First post ${away(next.publish_at)}.`
                       : "Nothing scheduled."];
}

function runLine() {
  const r = RUNS[0];
  if (!r) return "No workflow runs yet.";
  const nice = { "Publish due posts": "Last publish check", "Serve media": "Last media deploy",
                 "Check publishing credentials": "Last credential check",
                 "Render and schedule": "Last render" }[r.name] || r.name;
  const when = new Date(r.updated_at).toLocaleString(undefined,
    { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  const word = r.conclusion === "success" ? "passed" : r.conclusion ? r.conclusion : r.status;
  return `${nice}: ${word}, ${when} · <a href="${esc(r.html_url)}" target="_blank" rel="noopener">open in GitHub</a>`;
}

function paintList() {
  const b = buckets();
  const host = $("#list");
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", String(t.dataset.t === TAB)));
  if (TAB === "next") {
    host.innerHTML = b.next.length ? groupByDay(b.next)
      : '<p class="empty">Nothing scheduled. Every post has gone out, been stopped, or is waiting on you.</p>';
  } else if (TAB === "attention") {
    host.innerHTML = b.attention.length ? groupByDay(b.attention)
      : '<p class="empty">Nothing needs you. Everything is scheduled and running.</p>';
  } else {
    host.innerHTML = b.published.length ? b.published.map(card).join("")
      : '<p class="empty">Nothing published yet.</p>';
  }
  wire();
}

async function load() {
  document.body.innerHTML = '<div id="root"><div class="wrap"><p class="empty">Reading the queue…</p></div></div>';
  try { await readQueue(); RUNS = await readRuns(); }
  catch (e) {
    if (e.message === "token-bad") {
      try { localStorage.removeItem(KEY); } catch (_) {}
      return gate("That token no longer works. Paste a new one.");
    }
    $("#root").innerHTML = `<div class="wrap"><p class="empty">${esc(e.message)}</p></div>`;
    return;
  }

  const b = buckets();
  const up = b.next[0];
  const [igCls, igMsg] = platformHealth(b.all, "instagram");
  const [liCls, liMsg] = platformHealth(b.all, "linkedin");

  $("#root").innerHTML = `
<header><div class="hd"><h1>SoccerTex Review Desk</h1>
  <span class="right"><span>read ${new Date().toISOString().slice(11, 16)} UTC</span>
  <button id="refresh">Refresh</button></span>
</div></header>
<div class="wrap">
  <div class="next ${up ? "" : "none"}">
    <div class="k">Next out</div>
    ${up ? `<div class="h">${esc(hookOf(up))}</div>
            <div class="w">${PLAT[up.platform]} · ${esc(dayLabel(up.publish_at))} at
              <span class="num">${new Date(up.publish_at).toISOString().slice(11, 16)}</span> UTC
              · ${esc(away(up.publish_at))}</div>`
         : `<div class="h">Nothing scheduled</div>
            <div class="w">Every post has gone out, been stopped, or is waiting on you.</div>`}
  </div>

  <div class="health">
    <div class="hcard ${igCls}"><span class="bulb"></span>
      <span><span class="t">Instagram</span><br><span class="s">${esc(igMsg)}</span></span></div>
    <div class="hcard ${liCls}"><span class="bulb"></span>
      <span><span class="t">LinkedIn</span><br><span class="s">${esc(liMsg)}</span></span></div>
  </div>
  <p class="runline">${runLine()}</p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="next" aria-selected="true">Coming up <span class="b">0</span></button>
    <button class="tab" role="tab" data-t="attention" aria-selected="false">Needs you <span class="b">0</span></button>
    <button class="tab" role="tab" data-t="published" aria-selected="false">Published <span class="b">0</span></button>
  </div>
  <div id="list"></div>

  <footer>
    A change here is committed to the queue straight away and the next hourly run obeys it.
    Media is served from this same site; stock factory footage is stamped as library footage,
    never as SoccerTex's own floor.<br>
    <button class="lnk" id="forget">Forget my token on this device</button>
  </footer>
</div>`;

  document.querySelectorAll(".tab").forEach(t => t.onclick = () => { TAB = t.dataset.t; paintList(); });
  $("#refresh").onclick = () => load();
  $("#forget").onclick = () => {
    try { localStorage.removeItem(KEY); } catch (e) {}
    token = null; gate("Token forgotten on this device.");
  };
  paintCounts();
  paintList();
}

token ? load() : gate();
</script></body></html>
